name: Build & Test

on:
  pull_request:
    branches:
      - develop
    types: [ opened, synchronize, reopened ]

concurrency:
  group: bliki-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: read
  checks: write
  pull-requests: write

jobs:
  build:
    name: Build, Test & Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 21

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run build + tests
        run: ./gradlew build --parallel -Dorg.gradle.workers.max=5

      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2.23.0
        if: (!cancelled())
        with:
          files: '**/build/test-results/**/*.xml'
